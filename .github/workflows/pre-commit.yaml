name: Linters
on:
  push:
    branches: [main]
  pull_request:
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - uses: golangci/golangci-lint-action@v9
        with:
          args: --build-tags "containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper"
      - uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files --skip no-commit-to-branch --skip "golangci-lint-full" --skip "golangci-lint-fmt" --skip "golangci-lint-config-verify"
